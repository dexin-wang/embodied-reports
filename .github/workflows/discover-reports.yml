name: Discover embodied reports

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    # Explicitly authorized by the repository owner: this job needs the local
    # sub2api service and therefore runs only on the owner's self-hosted runner.
    runs-on: [self-hosted, linux, x64]
    env:
      OPENAI_BASE_URL: http://127.0.0.1:8080/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover candidate leads
        run: python automation/discover.py
      - name: Discover official project releases without papers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_VERIFIER_MODEL: gpt-5.6
        run: python automation/discover_official_projects.py
      - name: Verify official source, institution and public impact
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_VERIFIER_MODEL: gpt-5.6
        run: python automation/verify_reports.py
      - name: Generate source-grounded report dossiers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_VERIFIER_MODEL: gpt-5.6
        run: |
          python -m pip install --disable-pip-version-check PyMuPDF
          python automation/enrich_seed_reports.py
      - name: Extract original framework figures from verified report PDFs
        run: python automation/extract_frameworks.py
      - name: Save verified updates
        run: |
          git config user.name "embodied-reports-bot"
          git config user.email "embodied-reports-bot@users.noreply.github.com"
          git add data/verified.json data/dossiers.json automation/candidates.json automation/verification_audit.json public/frameworks
          git diff --cached --quiet || git commit -m "data: refresh verified embodied reports"
          git push
