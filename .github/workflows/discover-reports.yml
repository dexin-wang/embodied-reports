name: Discover embodied reports

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover and score reports
        run: python automation/discover.py
      - name: Extract original framework figures from report PDFs
        run: |
          python -m pip install --disable-pip-version-check PyMuPDF
          python automation/extract_frameworks.py
      - name: Generate source-grounded report dossiers with OpenAI
        if: ${{ secrets.OPENAI_API_KEY != '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
        run: python automation/enrich_reports.py
      - name: Save verified updates
        run: |
          git config user.name "embodied-reports-bot"
          git config user.email "embodied-reports-bot@users.noreply.github.com"
          git add data/discovered.json data/catalog.json data/enriched.json automation/candidates.json public/frameworks
          git diff --cached --quiet || git commit -m "data: refresh discovered reports"
          git push
