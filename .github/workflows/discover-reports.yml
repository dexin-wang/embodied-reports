name: Discover embodied reports

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Discover and figure refresh both commit generated catalog artifacts. One shared
# queue prevents them from advancing main while the other job is saving.
concurrency:
  group: catalog-writers
  cancel-in-progress: false

jobs:
  discover:
    # Explicitly authorized by the repository owner: this job needs the local
    # sub2api service and therefore runs only on the owner's self-hosted runner.
    runs-on: [self-hosted, linux, x64]
    env:
      OPENAI_BASE_URL: http://127.0.0.1:8080/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate organization coverage registry (no API)
        run: |
          python automation/organization_coverage.py --initialize --check --summary
          python automation/test_organization_coverage.py
      - name: Restore last generated catalog
        run: |
          git fetch origin catalog-data
          git checkout origin/catalog-data -- data public/frameworks automation/candidates.json automation/verification_audit.json
          if git cat-file -e origin/catalog-data:automation/organization_coverage.json 2>/dev/null; then
            git show origin/catalog-data:automation/organization_coverage.json > automation/organization_coverage.json
          fi
      - name: Discover candidate leads
        run: python automation/discover.py
      - name: Discover influential releases from independent WeChat media
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_VERIFIER_MODEL: gpt-5.6
        run: python automation/discover_official_projects.py --mode media
      - name: Discover official company releases (every three days)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_VERIFIER_MODEL: gpt-5.6
        run: |
          if [ $(( $(date -u +%s) / 86400 % 3 )) -eq 0 ]; then
            python automation/discover_official_projects.py --mode official
          else
            echo "Skipping official-company scan today; it runs every three days."
          fi
      - name: Verify official source, institution and public impact
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_VERIFIER_MODEL: gpt-5.6
        run: python automation/verify_reports.py
      - name: Generate source-grounded report dossiers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_VERIFIER_MODEL: gpt-5.6
        run: |
          python -m pip install --disable-pip-version-check PyMuPDF
          python automation/enrich_seed_reports.py
      - name: Clean taxonomy and structured detail lists
        run: python automation/clean_catalog.py
      - name: Extract original framework figures from PDFs or official project pages
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python automation/extract_frameworks.py --refresh
      - name: Validate generated catalog
        run: |
          python -m py_compile automation/organization_coverage.py automation/test_organization_coverage.py automation/discover_official_projects.py automation/verify_reports.py automation/extract_frameworks.py
          python automation/test_organization_coverage.py
          python automation/organization_coverage.py --check --summary
          python automation/validate_catalog.py
      - name: Publish generated catalog branch
        run: |
          git config user.name "embodied-reports-bot"
          git config user.email "embodied-reports-bot@users.noreply.github.com"
          git worktree prune
          CATALOG_OUTPUT="$(mktemp -d "${RUNNER_TEMP}/catalog-output.XXXXXX")"
          rmdir "$CATALOG_OUTPUT"
          cleanup() {
            git worktree remove --force "$CATALOG_OUTPUT" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          git worktree add --detach "$CATALOG_OUTPUT" origin/catalog-data
          cp -a data "$CATALOG_OUTPUT/"
          cp -a public/frameworks "$CATALOG_OUTPUT/public/"
          cp -a automation/candidates.json automation/verification_audit.json automation/organization_coverage.json "$CATALOG_OUTPUT/automation/"
          git -C "$CATALOG_OUTPUT" add data public/frameworks automation/candidates.json automation/verification_audit.json automation/organization_coverage.json
          if git -C "$CATALOG_OUTPUT" diff --cached --quiet; then exit 0; fi
          git -C "$CATALOG_OUTPUT" commit -m "data: refresh verified embodied reports"
          git -C "$CATALOG_OUTPUT" push origin HEAD:catalog-data
