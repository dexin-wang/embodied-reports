name: Discover embodied reports

on:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
    paths:
      - "automation/company_roster.json"
      - "automation/media_watchlist.json"
      - "automation/official_seed_projects.json"
      - "automation/discover_official_projects.py"
      - "automation/verify_reports.py"
      - "automation/clean_catalog.py"
      - "automation/sources.json"
      - ".github/workflows/discover-reports.yml"
  workflow_dispatch:

permissions:
  contents: write

# Discover and figure refresh both commit generated catalog artifacts. One shared
# queue prevents them from advancing main while the other job is saving.
concurrency:
  group: catalog-writers
  cancel-in-progress: false

jobs:
  discover:
    # Explicitly authorized by the repository owner: this job needs the local
    # sub2api service and therefore runs only on the owner's self-hosted runner.
    runs-on: [self-hosted, linux, x64]
    env:
      OPENAI_BASE_URL: http://127.0.0.1:8080/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore last generated catalog
        run: |
          git fetch origin catalog-data
          git checkout origin/catalog-data -- data public/frameworks automation/candidates.json automation/verification_audit.json
      - name: Discover candidate leads
        run: python automation/discover.py
      - name: Discover influential releases from independent WeChat media
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_VERIFIER_MODEL: gpt-5.6
        run: python automation/discover_official_projects.py --mode media
      - name: Discover official company releases (every three days)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_VERIFIER_MODEL: gpt-5.6
        run: |
          if [ $(( $(date -u +%s) / 86400 % 3 )) -eq 0 ]; then
            python automation/discover_official_projects.py --mode official
          else
            echo "Skipping official-company scan today; it runs every three days."
          fi
      - name: Verify official source, institution and public impact
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_VERIFIER_MODEL: gpt-5.6
        run: python automation/verify_reports.py
      - name: Generate source-grounded report dossiers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_VERIFIER_MODEL: gpt-5.6
        run: |
          python -m pip install --disable-pip-version-check PyMuPDF
          python automation/enrich_seed_reports.py
      - name: Clean taxonomy and structured detail lists
        run: python automation/clean_catalog.py
      - name: Extract original framework figures from PDFs or official project pages
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python automation/extract_frameworks.py --refresh
      - name: Validate generated catalog
        run: |
          python -m py_compile automation/discover_official_projects.py automation/verify_reports.py automation/extract_frameworks.py
          python automation/validate_catalog.py
      - name: Publish generated catalog branch
        run: |
          git config user.name "embodied-reports-bot"
          git config user.email "embodied-reports-bot@users.noreply.github.com"
          git worktree add ../catalog-output origin/catalog-data
          cp -a data ../catalog-output/
          cp -a public/frameworks ../catalog-output/public/
          cp -a automation/candidates.json automation/verification_audit.json ../catalog-output/automation/
          cd ../catalog-output
          git switch -C catalog-data origin/catalog-data
          git add data public/frameworks automation/candidates.json automation/verification_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh verified embodied reports"
          git push origin HEAD:catalog-data
