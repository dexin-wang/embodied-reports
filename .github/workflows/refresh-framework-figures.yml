name: Refresh framework figures

on:
  push:
    branches: [main]
    paths:
      - "automation/extract_frameworks.py"
      - "automation/framework_sources.json"
      - "automation/validate_catalog.py"
      - ".github/workflows/refresh-framework-figures.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-writers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore last generated catalog
        run: |
          git fetch origin catalog-data
          git checkout origin/catalog-data -- data public/frameworks automation/candidates.json automation/verification_audit.json
      - name: Install image-only dependencies
        run: python -m pip install --disable-pip-version-check Pillow PyMuPDF
      - name: Preflight required official image sources
        run: |
          python -m py_compile automation/extract_frameworks.py automation/validate_catalog.py
          python automation/extract_frameworks.py --preflight-ids cosa-05-v3,generalist-gen-1
      - name: Refresh official project images
        run: python automation/extract_frameworks.py --refresh
      - name: Validate generated catalog
        run: python automation/validate_catalog.py
      - name: Publish validated image catalog
        run: |
          git config user.name "embodied-reports-bot"
          git config user.email "embodied-reports-bot@users.noreply.github.com"
          git worktree prune
          CATALOG_OUTPUT="$(mktemp -d "${RUNNER_TEMP}/catalog-output.XXXXXX")"
          rmdir "$CATALOG_OUTPUT"
          cleanup() {
            git worktree remove --force "$CATALOG_OUTPUT" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          git worktree add --detach "$CATALOG_OUTPUT" origin/catalog-data
          cp -a public/frameworks "$CATALOG_OUTPUT/public/"
          git -C "$CATALOG_OUTPUT" add public/frameworks
          if git -C "$CATALOG_OUTPUT" diff --cached --quiet; then exit 0; fi
          git -C "$CATALOG_OUTPUT" commit -m "data: refresh validated project figures"
          git -C "$CATALOG_OUTPUT" push origin HEAD:catalog-data
