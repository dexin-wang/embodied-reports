name: Refresh framework figures

on:
  push:
    branches: [main]
    paths:
      - "automation/extract_frameworks.py"
      - "automation/framework_sources.json"
      - "data/verified.json"
      - "app/reports.ts"
      - ".github/workflows/refresh-framework-figures.yml"
  workflow_dispatch:

permissions:
  contents: write

# Shares the write queue with discovery because both workflows update
# public/frameworks and can otherwise cause non-fast-forward pushes.
concurrency:
  group: catalog-writers
  cancel-in-progress: false

jobs:
  extract:
    # This job deliberately uses a GitHub-hosted runner: it only downloads
    # public PDFs/project-page images and does not require the local sub2api.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract PDF-first and official-project-page figures
        run: |
          python -m pip install --disable-pip-version-check PyMuPDF Pillow
          python automation/extract_frameworks.py --refresh
      - name: Save source images
        run: |
          git config user.name "embodied-reports-bot"
          git config user.email "embodied-reports-bot@users.noreply.github.com"
          git add public/frameworks
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "assets: refresh source framework figures"
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            git rebase --abort || true
            echo "Push race detected; retrying ($attempt/3)"
            sleep "$attempt"
          done
          echo "Unable to publish refreshed figures after three attempts."
          exit 1
